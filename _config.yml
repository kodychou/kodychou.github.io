# Place this file beside README.md in your GitHub Pages publishing folder.
# The website content and styles are in README.md. No index file is needed.
title: Dakota Chou
description: Games, web applications, and robotics projects by Dakota Chou.
lang: en
timezone: America/Los_Angeles

theme: jekyll-theme-primer
markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: false

# README.md explicitly generates the homepage at /.
# Keep its front matter intact; do not wrap the file in Markdown code fences.
defaults:
  - scope:
      path: "README.md"
    values:
      layout: default
      permalink: /

# These optional values are only for site URL metadata.
# For a user site, use https://YOUR-USERNAME.github.io and an empty baseurl.
# For a project site, use the same url and baseurl: /YOUR-REPOSITORY.
url: "https://kodychou.github.io"
baseurl: ""

show_downloads: false
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
